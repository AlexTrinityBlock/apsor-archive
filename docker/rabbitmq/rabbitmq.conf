# Local RabbitMQ tuning for the Apsor Archive demo stack.
#
# The broker is only a low-latency dispatch queue: PostgreSQL
# ``file_ingest_job`` remains the authoritative job ledger. The container is
# capped at 384 MB, so publish back-pressure at 200 MB instead of letting the
# Erlang VM grow into the container limit.
vm_memory_high_watermark.absolute = 200MB
disk_free_limit.absolute = 512MB
