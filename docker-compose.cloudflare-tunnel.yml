name: apsor-archive-cloudflare

# Cloudflare Tunnel deployment. No service publishes a host port. The tunnel
# ingress should point at `http://caddy:80` for APSOR_PUBLIC_HOST.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apsor
      POSTGRES_PASSWORD: apsor
      POSTGRES_DB: apsor_archive
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apsor -d apsor_archive"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cache:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      APSOR_DATABASE_URL: postgresql+psycopg://apsor:apsor@db:5432/apsor_archive
      APSOR_CACHE_URL: redis://cache:6379/0
      APSOR_DATA_DIR: /data
      APSOR_STATIC_DIR: /app/frontend/dist
      APSOR_TIMEZONE: Asia/Taipei
      APSOR_COOKIE_SECURE: "true"
      # New originals use R2 by default after the staged migration. Override
      # with APSOR_STORAGE_BACKEND=local for the first cutover boot.
      APSOR_STORAGE_BACKEND: ${APSOR_STORAGE_BACKEND:-r2}
      # Non-secret R2 configuration. Credentials are read from the mounted
      # .secrets/r2.env by the app, never from the container environment.
      APSOR_R2_ENDPOINT_URL: ${APSOR_R2_ENDPOINT_URL:-https://129b4e3d8fc9fe004f88fbb29dcb124b.r2.cloudflarestorage.com}
      APSOR_R2_BUCKET: ${APSOR_R2_BUCKET:-apsor-archive}
      APSOR_R2_REGION: ${APSOR_R2_REGION:-auto}
      APSOR_R2_PREFIX: ${APSOR_R2_PREFIX:-}
      # The dedicated worker service owns ingestion; keep the API lifespan
      # fallback off so only one process drains the queue.
      APSOR_INGEST_WORKER_ENABLED: "false"
    volumes:
      - ./data-cloudflare:/data
      # .secrets/r2.env must be readable by container uid 10001 (mode 644 or
      # matching ownership).
      - ./.secrets:/app/backend/.secrets:ro
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["/app/backend/.venv/bin/apsor-archive", "worker"]
    environment:
      APSOR_DATABASE_URL: postgresql+psycopg://apsor:apsor@db:5432/apsor_archive
      APSOR_CACHE_URL: redis://cache:6379/0
      APSOR_DATA_DIR: /data
      APSOR_TIMEZONE: Asia/Taipei
      APSOR_COOKIE_SECURE: "true"
      APSOR_STORAGE_BACKEND: ${APSOR_STORAGE_BACKEND:-r2}
      APSOR_R2_ENDPOINT_URL: ${APSOR_R2_ENDPOINT_URL:-https://129b4e3d8fc9fe004f88fbb29dcb124b.r2.cloudflarestorage.com}
      APSOR_R2_BUCKET: ${APSOR_R2_BUCKET:-apsor-archive}
      APSOR_R2_REGION: ${APSOR_R2_REGION:-auto}
      APSOR_R2_PREFIX: ${APSOR_R2_PREFIX:-}
    volumes:
      - ./data-cloudflare:/data
      # .secrets/r2.env must be readable by container uid 10001 (mode 644 or
      # matching ownership).
      - ./.secrets:/app/backend/.secrets:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: ./docker/caddy
    environment:
      APSOR_PUBLIC_HOST: ${APSOR_PUBLIC_HOST:-api.example.com}
    expose:
      - "80"
    volumes:
      - caddy-logs:/var/log/caddy
    depends_on:
      - api
    restart: unless-stopped

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token-file /run/secrets/cf_token
    secrets:
      - cf_token
    depends_on:
      - caddy
    restart: unless-stopped

secrets:
  cf_token:
    file: ./secrets/cf_token.txt

volumes:
  postgres-data:
  caddy-logs:
