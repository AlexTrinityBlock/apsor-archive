name: apsor-archive

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apsor
      POSTGRES_PASSWORD: apsor
      POSTGRES_DB: apsor_archive
    ports:
      - "127.0.0.1:55432:5432"
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apsor -d apsor_archive"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cache:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      APSOR_DATABASE_URL: postgresql+psycopg://apsor:apsor@db:5432/apsor_archive
      APSOR_CACHE_URL: redis://cache:6379/0
      APSOR_DATA_DIR: /data
      APSOR_STATIC_DIR: /app/frontend/dist
      APSOR_TIMEZONE: Asia/Taipei
      # New originals use R2 by default. Set APSOR_STORAGE_BACKEND=local for
      # the first cutover boot, then run the storage migration and switch back.
      APSOR_STORAGE_BACKEND: ${APSOR_STORAGE_BACKEND:-r2}
      # Non-secret R2 configuration. The account endpoint has no default: set
      # APSOR_R2_ENDPOINT_URL in .env before running with the r2 backend.
      # Credentials are read from the mounted .secrets/r2.env by the app and
      # never enter the container environment.
      APSOR_R2_ENDPOINT_URL: ${APSOR_R2_ENDPOINT_URL:-}
      APSOR_R2_BUCKET: ${APSOR_R2_BUCKET:-apsor-archive}
      APSOR_R2_REGION: ${APSOR_R2_REGION:-auto}
      APSOR_R2_PREFIX: ${APSOR_R2_PREFIX:-}
      # The dedicated worker service owns ingestion; keep the API lifespan
      # fallback off so only one process drains the queue.
      APSOR_INGEST_WORKER_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      # Read-only local secrets. The app reads .secrets/deepseek.env and
      # .secrets/r2.env itself, so keys never become container environment
      # variables. Files must be readable by container uid 10001 (mode 644 or
      # matching ownership).
      - ./.secrets:/app/backend/.secrets:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/backend/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["/app/backend/.venv/bin/apsor-archive", "worker"]
    environment:
      APSOR_DATABASE_URL: postgresql+psycopg://apsor:apsor@db:5432/apsor_archive
      APSOR_CACHE_URL: redis://cache:6379/0
      APSOR_DATA_DIR: /data
      APSOR_TIMEZONE: Asia/Taipei
      APSOR_STORAGE_BACKEND: ${APSOR_STORAGE_BACKEND:-r2}
      APSOR_R2_ENDPOINT_URL: ${APSOR_R2_ENDPOINT_URL:-}
      APSOR_R2_BUCKET: ${APSOR_R2_BUCKET:-apsor-archive}
      APSOR_R2_REGION: ${APSOR_R2_REGION:-auto}
      APSOR_R2_PREFIX: ${APSOR_R2_PREFIX:-}
    volumes:
      - ./data:/data
      # .secrets/r2.env provides the R2 credentials; it must be readable by
      # container uid 10001 (mode 644 or matching ownership).
      - ./.secrets:/app/backend/.secrets:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
    # The physical name is explicit so a Compose project rename cannot silently
    # orphan the database volume.
    name: apsor-archive_postgres-data
