name: apsor-archive

# Non-secret object-storage settings shared by the API and the worker. Access
# keys are never listed here: the app reads them from the read-only .secrets/
# mount (r2.env for R2, s3.env for RustFS or another S3 store).
x-storage-env: &storage-env
  APSOR_STORAGE_BACKEND: ${APSOR_STORAGE_BACKEND:-auto}
  # Cloudflare R2. The account endpoint has no default: set
  # APSOR_R2_ENDPOINT_URL in .env (or R2_ACCOUNT_ENDPOINT in .secrets/r2.env).
  APSOR_R2_ENDPOINT_URL: ${APSOR_R2_ENDPOINT_URL:-}
  APSOR_R2_BUCKET: ${APSOR_R2_BUCKET:-apsor-archive}
  APSOR_R2_REGION: ${APSOR_R2_REGION:-auto}
  APSOR_R2_PREFIX: ${APSOR_R2_PREFIX:-}
  # Generic S3. The defaults target the bundled RustFS service.
  APSOR_S3_ENDPOINT_URL: ${APSOR_S3_ENDPOINT_URL:-http://rustfs:9000}
  APSOR_S3_BUCKET: ${APSOR_S3_BUCKET:-apsor-archive}
  APSOR_S3_REGION: ${APSOR_S3_REGION:-us-east-1}
  APSOR_S3_PREFIX: ${APSOR_S3_PREFIX:-}
  APSOR_S3_ADDRESSING_STYLE: ${APSOR_S3_ADDRESSING_STYLE:-path}
  APSOR_S3_CREATE_BUCKET: ${APSOR_S3_CREATE_BUCKET:-true}

# Single production stack: Cloudflare Tunnel -> Caddy -> API. No service
# publishes a host port; the tunnel is the only ingress. Local development
# dependencies live in docker-compose.dev.yml.
#
# Run `./start.sh setup` (or `make setup`) first: the wizard writes .env and the
# secret files this file reads. Object storage is selected there:
#   - rustfs (default for new installs): the bundled `rustfs` service below,
#     enabled by COMPOSE_PROFILES=rustfs in .env.
#   - r2: a private Cloudflare R2 bucket (.secrets/r2.env).
#   - s3: any other S3-compatible endpoint (.secrets/s3.env).
# When APSOR_STORAGE_BACKEND is unset, `auto` keeps an existing R2 deployment
# on R2, then prefers a configured S3 store, then local disk.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apsor
      POSTGRES_PASSWORD: apsor
      POSTGRES_DB: apsor_archive
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apsor -d apsor_archive"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cache:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Demo dispatch queue. PostgreSQL remains the job ledger; RabbitMQ only wakes
  # the worker and provides manual-ack redelivery plus a delayed retry queue.
  # The credentials below are local demo defaults: change them for any shared
  # deployment. The broker stays on the Compose network only.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    # Keep the broker small on a laptop. rabbitmq.conf lowers the watermark.
    mem_limit: 384m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-apsor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-apsor}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio none"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Bundled S3-compatible object storage, the default for new installs. It is
  # reachable only on the Compose network and publishes no host port. The app
  # creates the bucket on its first write (APSOR_S3_CREATE_BUCKET).
  rustfs:
    image: rustfs/rustfs:1.0.6
    profiles: ["rustfs"]
    mem_limit: 512m
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
    expose:
      - "9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      APSOR_DATABASE_URL: postgresql+psycopg://apsor:apsor@db:5432/apsor_archive
      APSOR_CACHE_URL: redis://cache:6379/0
      APSOR_DATA_DIR: /data
      APSOR_STATIC_DIR: /app/frontend/dist
      APSOR_TIMEZONE: Asia/Taipei
      # The tunnel terminates TLS at Cloudflare, so the browser always reaches
      # the app over HTTPS. Keep the session cookie Secure.
      APSOR_COOKIE_SECURE: "true"
      APSOR_SESSION_TTL_HOURS: ${APSOR_SESSION_TTL_HOURS:-720}
      <<: *storage-env
      # The dedicated worker service owns ingestion; keep the API lifespan
      # fallback off so only one process drains the queue.
      APSOR_INGEST_WORKER_ENABLED: "false"
      # The API still publishes dispatch wake-ups; the worker consumes them.
      # Demo credentials only: change RABBITMQ_DEFAULT_USER/PASS in .env before
      # any shared or internet-reachable deployment.
      APSOR_RABBITMQ_ENABLED: "true"
      APSOR_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-apsor}:${RABBITMQ_DEFAULT_PASS:-apsor}@rabbitmq:5672/
    expose:
      - "8000"
    volumes:
      - ./data:/data
      # Read-only local secrets. The app reads .secrets/deepseek.env,
      # .secrets/r2.env, and .secrets/s3.env itself, so keys never become container environment
      # variables. Files must be readable by container uid 10001 (mode 644 or
      # matching ownership).
      - ./.secrets:/app/backend/.secrets:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Only started with COMPOSE_PROFILES=rustfs; otherwise ignored.
      rustfs:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        - CMD
        - /app/backend/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["/app/backend/.venv/bin/apsor-archive", "worker"]
    environment:
      APSOR_DATABASE_URL: postgresql+psycopg://apsor:apsor@db:5432/apsor_archive
      APSOR_CACHE_URL: redis://cache:6379/0
      APSOR_DATA_DIR: /data
      APSOR_TIMEZONE: Asia/Taipei
      <<: *storage-env
      # The dedicated worker owns the consumer. PostgreSQL remains the ledger,
      # so a broker outage only delays dispatch until polling catches up.
      APSOR_RABBITMQ_ENABLED: "true"
      APSOR_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-apsor}:${RABBITMQ_DEFAULT_PASS:-apsor}@rabbitmq:5672/
    volumes:
      - ./data:/data
      # .secrets/r2.env or .secrets/s3.env provides the object-store
      # credentials; they must be readable by container uid 10001.
      - ./.secrets:/app/backend/.secrets:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Only started with COMPOSE_PROFILES=rustfs; otherwise ignored.
      rustfs:
        condition: service_healthy
        required: false
    restart: unless-stopped

  caddy:
    build:
      context: ./docker/caddy
    environment:
      APSOR_PUBLIC_HOST: ${APSOR_PUBLIC_HOST:?set APSOR_PUBLIC_HOST in .env}
    expose:
      - "80"
    volumes:
      - caddy-logs:/var/log/caddy
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  cloudflare-tunnel:
    image: cloudflare/cloudflared:2026.10.4
    command: tunnel --no-autoupdate run --token-file /run/secrets/cf_token
    secrets:
      - cf_token
    depends_on:
      - caddy
    restart: unless-stopped

secrets:
  cf_token:
    file: ./secrets/cf_token.txt
  # Written by ./start.sh setup when RustFS is selected. The app reads the same
  # pair from .secrets/s3.env.
  rustfs_access_key:
    file: ./secrets/rustfs_access_key.txt
  rustfs_secret_key:
    file: ./secrets/rustfs_secret_key.txt

volumes:
  postgres-data:
    # The physical name is explicit so a Compose project rename cannot silently
    # orphan the database volume.
    name: apsor-archive_postgres-data
  rabbitmq-data:
    name: apsor-archive_rabbitmq-data
  rustfs-data:
    name: apsor-archive_rustfs-data
  caddy-logs:
    name: apsor-archive_caddy-logs
