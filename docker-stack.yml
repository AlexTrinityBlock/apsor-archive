# Docker Swarm stack for a single-node Swarm (all services run on the manager,
# because the archive data, secrets, and broker config are host bind mounts).
#
#   ./start.sh setup                 # once: writes .env and the secret files
#   docker compose build             # builds apsor-archive-api/-worker/-caddy
#   docker swarm init                # once, if this machine is not a manager yet
#   set -a; . ./.env; set +a         # `docker stack deploy` does not read .env
#   docker stack deploy -c docker-stack.yml apsor
#
# Differences from docker-compose.yml: images are built by Compose and only
# referenced here (`build:` is ignored by Swarm), restart and memory limits use
# `deploy:`, start order is handled by restarts (`depends_on` is ignored), and
# RustFS is always part of the stack (scale it to 0 when you use R2 or S3).
x-storage-env: &storage-env
  APSOR_STORAGE_BACKEND: ${APSOR_STORAGE_BACKEND:-auto}
  APSOR_R2_ENDPOINT_URL: ${APSOR_R2_ENDPOINT_URL:-}
  APSOR_R2_BUCKET: ${APSOR_R2_BUCKET:-apsor-archive}
  APSOR_R2_REGION: ${APSOR_R2_REGION:-auto}
  APSOR_R2_PREFIX: ${APSOR_R2_PREFIX:-}
  APSOR_S3_ENDPOINT_URL: ${APSOR_S3_ENDPOINT_URL:-http://rustfs:9000}
  APSOR_S3_BUCKET: ${APSOR_S3_BUCKET:-apsor-archive}
  APSOR_S3_REGION: ${APSOR_S3_REGION:-us-east-1}
  APSOR_S3_PREFIX: ${APSOR_S3_PREFIX:-}
  APSOR_S3_ADDRESSING_STYLE: ${APSOR_S3_ADDRESSING_STYLE:-path}
  APSOR_S3_CREATE_BUCKET: ${APSOR_S3_CREATE_BUCKET:-true}

x-manager: &on-manager
  placement:
    constraints: ["node.role == manager"]
  restart_policy:
    condition: any
    delay: 5s

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apsor
      POSTGRES_PASSWORD: apsor
      POSTGRES_DB: apsor_archive
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apsor -d apsor_archive"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy: *on-manager

  cache:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy: *on-manager

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-apsor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-apsor}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio none"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      <<: *on-manager
      resources:
        limits:
          memory: 384M

  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      <<: *on-manager
      resources:
        limits:
          memory: 512M

  api:
    image: apsor-archive-api:latest
    environment:
      APSOR_DATABASE_URL: postgresql+psycopg://apsor:apsor@db:5432/apsor_archive
      APSOR_CACHE_URL: redis://cache:6379/0
      APSOR_DATA_DIR: /data
      APSOR_STATIC_DIR: /app/frontend/dist
      APSOR_TIMEZONE: ${APSOR_TIMEZONE:-Asia/Taipei}
      APSOR_COOKIE_SECURE: "true"
      APSOR_SESSION_TTL_HOURS: ${APSOR_SESSION_TTL_HOURS:-720}
      <<: *storage-env
      APSOR_INGEST_WORKER_ENABLED: "false"
      APSOR_RABBITMQ_ENABLED: "true"
      APSOR_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-apsor}:${RABBITMQ_DEFAULT_PASS:-apsor}@rabbitmq:5672/
    volumes:
      - ./data:/data
      - ./.secrets:/app/backend/.secrets:ro
    healthcheck:
      test:
        - CMD
        - /app/backend/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy: *on-manager

  worker:
    image: apsor-archive-worker:latest
    command: ["/app/backend/.venv/bin/apsor-archive", "worker"]
    environment:
      APSOR_DATABASE_URL: postgresql+psycopg://apsor:apsor@db:5432/apsor_archive
      APSOR_CACHE_URL: redis://cache:6379/0
      APSOR_DATA_DIR: /data
      APSOR_TIMEZONE: ${APSOR_TIMEZONE:-Asia/Taipei}
      <<: *storage-env
      APSOR_RABBITMQ_ENABLED: "true"
      APSOR_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-apsor}:${RABBITMQ_DEFAULT_PASS:-apsor}@rabbitmq:5672/
    volumes:
      - ./data:/data
      - ./.secrets:/app/backend/.secrets:ro
    deploy: *on-manager

  caddy:
    image: apsor-archive-caddy:latest
    environment:
      APSOR_PUBLIC_HOST: ${APSOR_PUBLIC_HOST:?set APSOR_PUBLIC_HOST in .env}
    volumes:
      - caddy-logs:/var/log/caddy
    deploy: *on-manager

  cloudflare-tunnel:
    image: cloudflare/cloudflared:2026.10.4
    command: tunnel --no-autoupdate run --token-file /run/secrets/cf_token
    secrets:
      - cf_token
    deploy: *on-manager

secrets:
  cf_token:
    file: ./secrets/cf_token.txt
  rustfs_access_key:
    file: ./secrets/rustfs_access_key.txt
  rustfs_secret_key:
    file: ./secrets/rustfs_secret_key.txt

volumes:
  postgres-data:
    name: apsor-archive_postgres-data
  rabbitmq-data:
    name: apsor-archive_rabbitmq-data
  rustfs-data:
    name: apsor-archive_rustfs-data
  caddy-logs:
    name: apsor-archive_caddy-logs
