name: apsor-archive-dev

# Local development dependencies only. Run the API and Vite on the host:
#   docker compose -f docker-compose.dev.yml up -d --wait
#   cd backend && uv run apsor-archive --reload
#   cd frontend && bun run dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apsor
      POSTGRES_PASSWORD: apsor
      POSTGRES_DB: apsor_archive
    ports:
      - "127.0.0.1:55432:5432"
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apsor -d apsor_archive"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cache:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
    # The physical name is explicit so a Compose project rename cannot silently
    # orphan the database volume.
    name: apsor-archive-dev_postgres-data
