name: apsor-archive-dev

# Local development dependencies only. Run the API and Vite on the host:
#   docker compose -f docker-compose.dev.yml up -d --wait
#   cd backend && uv run apsor-archive --reload
#   cd frontend && bun run dev
#
# RabbitMQ is exposed on the host for a host-run API/worker. Match the Compose
# defaults with:
#   APSOR_RABBITMQ_ENABLED=true
#   APSOR_RABBITMQ_URL=amqp://apsor:apsor@127.0.0.1:5672/
# The management UI is http://127.0.0.1:15672 (apsor / apsor).
# PostgreSQL is still the authoritative ingest-job ledger; the broker only
# dispatches wake-ups and redelivers unacked messages after a worker crash.
#
# Local disk is the default storage for development. To exercise the
# S3-compatible path against RustFS, start it with the `rustfs` profile:
#   docker compose -f docker-compose.dev.yml --profile rustfs up -d --wait
# and point the host-run API/worker at it (demo credentials, dev only):
#   APSOR_STORAGE_BACKEND=s3  APSOR_S3_ENDPOINT_URL=http://127.0.0.1:59000
#   APSOR_S3_BUCKET=apsor-archive-dev  APSOR_S3_CREATE_BUCKET=true
#   .secrets/s3.env: APSOR_S3_ACCESS_KEY_ID=apsor-dev
#                    APSOR_S3_SECRET_ACCESS_KEY=apsor-dev-secret
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apsor
      POSTGRES_PASSWORD: apsor
      POSTGRES_DB: apsor_archive
    ports:
      - "127.0.0.1:55432:5432"
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apsor -d apsor_archive"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cache:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Demo dispatch queue for host-run API/worker development. Same image, memory
  # cap, watermark config, and demo credentials as docker-compose.yml.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    mem_limit: 384m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-apsor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-apsor}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio none"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Optional S3-compatible store for development (profile `rustfs`).
  rustfs:
    image: rustfs/rustfs:1.0.6
    profiles: ["rustfs"]
    mem_limit: 512m
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_DEV_ACCESS_KEY:-apsor-dev}
      RUSTFS_SECRET_KEY: ${RUSTFS_DEV_SECRET_KEY:-apsor-dev-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      - "127.0.0.1:59000:9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
    # The physical name is explicit so a Compose project rename cannot silently
    # orphan the database volume.
    name: apsor-archive-dev_postgres-data
  rabbitmq-data:
    name: apsor-archive-dev_rabbitmq-data
  rustfs-data:
    name: apsor-archive-dev_rustfs-data
